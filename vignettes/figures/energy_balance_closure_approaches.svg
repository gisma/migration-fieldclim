<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Energy-balance closure approaches in fieldClim heat-flux methods</title>
  <desc id="desc">A conceptual diagram showing how different fieldClim method families handle the unresolved energy-balance residual.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#444" />
    </marker>
    <style>
      .title { font: 700 32px sans-serif; fill: #1f2933; }
      .subtitle { font: 400 18px sans-serif; fill: #4b5563; }
      .box-title { font: 700 19px sans-serif; fill: #1f2933; }
      .box-sub { font: 600 15px sans-serif; fill: #374151; }
      .body { font: 400 15px sans-serif; fill: #374151; }
      .small { font: 400 13px sans-serif; fill: #4b5563; }
      .formula { font: 600 16px monospace; fill: #111827; }
      .box { stroke: #7a869a; stroke-width: 1.4; rx: 18; ry: 18; }
      .input { fill: #f4f7fb; stroke: #4b5563; stroke-width: 1.6; rx: 18; ry: 18; }
      .card1 { fill: #eef6ff; }
      .card2 { fill: #f2f8ef; }
      .card3 { fill: #fff7e8; }
      .card4 { fill: #f7efff; }
      .rest { fill: #f3f4f6; stroke: #6b7280; stroke-dasharray: 5 5; }
      .line { stroke: #444; stroke-width: 1.8; marker-end: url(#arrow); fill: none; }
      .muted-line { stroke: #6b7280; stroke-width: 1.2; marker-end: url(#arrow); fill: none; stroke-dasharray: 4 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="760" fill="#ffffff" />
  <text x="70" y="62" class="title">Energy-balance closure is a modelling decision</text>
  <text x="70" y="96" class="subtitle">The same balance frame is used in different ways: terms can be measured, estimated, assumed, assigned, or left unresolved.</text>

  <rect x="70" y="135" width="1260" height="105" class="input" />
  <text x="105" y="174" class="box-title">Starting point: available turbulent energy</text>
  <text x="105" y="207" class="formula">A = Rn - G</text>
  <text x="315" y="207" class="body">Net radiation minus soil heat flux defines the energy available for sensible and latent heat exchange.</text>
  <text x="105" y="228" class="small">The reduced closure form is only one possible treatment of the unresolved residual.</text>

  <path d="M700 240 L700 285" class="line" />

  <rect x="70" y="300" width="292" height="250" class="box card1" />
  <text x="95" y="335" class="box-title">1. Partition closure</text>
  <text x="95" y="363" class="box-sub">Priestley-Taylor / Bowen</text>
  <text x="95" y="402" class="body">Assume the reduced balance closes.</text>
  <text x="95" y="433" class="formula">R_E = 0</text>
  <text x="95" y="471" class="body">Then split available energy into</text>
  <text x="95" y="493" class="body">sensible and latent heat using an</text>
  <text x="95" y="515" class="body">empirical or gradient-ratio rule.</text>

  <rect x="386" y="300" width="292" height="250" class="box card2" />
  <text x="411" y="335" class="box-title">2. Residual assignment</text>
  <text x="411" y="363" class="box-sub">Bulk-Residual</text>
  <text x="411" y="402" class="body">Estimate sensible heat first.</text>
  <text x="411" y="433" class="formula">H_bulk</text>
  <text x="411" y="471" class="body">Assign everything left to latent heat.</text>
  <text x="411" y="502" class="formula">LE_res = A - H_bulk</text>

  <rect x="702" y="300" width="292" height="250" class="box card3" />
  <text x="727" y="335" class="box-title">3. LE-only open balance</text>
  <text x="727" y="363" class="box-sub">Penman / Penman-type</text>
  <text x="727" y="402" class="body">Estimate latent heat only.</text>
  <text x="727" y="433" class="formula">LE_Penman</text>
  <text x="727" y="471" class="body">The complement remains unresolved:</text>
  <text x="727" y="502" class="formula">A - LE</text>
  <text x="727" y="532" class="small">sensible heat + storage + advection + error</text>

  <rect x="1018" y="300" width="312" height="250" class="box card4" />
  <text x="1043" y="335" class="box-title">4. Profile diagnostic</text>
  <text x="1043" y="363" class="box-sub">Monin-Obukhov / Profile</text>
  <text x="1043" y="402" class="body">Estimate turbulent fluxes from</text>
  <text x="1043" y="424" class="body">profile and stability assumptions.</text>
  <text x="1043" y="462" class="formula">H_profile, LE_profile</text>
  <text x="1043" y="501" class="body">Keep the remaining difference visible.</text>
  <text x="1043" y="532" class="formula">R_profile = A - H - LE</text>

  <path d="M700 285 L216 285 L216 300" class="line" />
  <path d="M700 285 L532 285 L532 300" class="line" />
  <path d="M700 285 L848 285 L848 300" class="line" />
  <path d="M700 285 L1174 285 L1174 300" class="line" />

  <rect x="70" y="600" width="1260" height="92" class="rest" rx="16" ry="16" />
  <text x="105" y="634" class="box-title">Interpretation rule</text>
  <text x="105" y="664" class="body">A formally closed result is not automatically a physically validated result. Closure shows how the method treats the unknown remainder.</text>
  <text x="105" y="687" class="body">An open residual is not automatically a failure. It can be a useful diagnostic of scale mismatch, storage, advection, or model error.</text>
</svg>
